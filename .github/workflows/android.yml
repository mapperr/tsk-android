name: Android APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: chmod +x gradlew build-apk.sh tests/run.sh && ./tests/run.sh && ./build-apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: tsk-android-debug-apk
          path: tsk-android-debug.apk
